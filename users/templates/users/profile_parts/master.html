{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'production_plan/css/styles.css' %}">

<div class="container mt-4">
    {# Кнопки действий - упрощенный вариант #}
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a href="{% url 'shift_assignment:create' %}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Создать
        </a>
        {% if active_assignments %}
        <button type="button" class="btn btn-danger"
                onclick="confirmClearAssignments('{% url 'shift_assignment:delete_all' %}', '{{ csrf_token }}')">
            <i class="bi bi-trash"></i> Удалить все активные
        </button>
        {% endif %}
        <a href="{% url 'shift_assignment:upload' %}" class="btn btn-primary">
            <i class="bi bi-upload"></i> Загрузить задания из Excel
        </a>
    </div>

    {# Подключаем таблицу заданий из отдельного шаблона #}
    {% include 'users/assignment_table.html' %}
</div>

<script src="{% static 'production_plan/js/scripts.js' %}"></script>
{% endblock %}
