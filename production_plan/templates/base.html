{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ title }}</title>
    <link rel="icon" href="{% static 'production_plan/icons/icon.png' %}" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ваши стили -->
    <link rel="stylesheet" href="{% static 'production_plan/css/styles.css' %}">

    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <header>
        <h1 class="text-center">Производственный план</h1>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="{% url 'production_plan:list' %}">Главная</a>

            {% if user.is_authenticated %}
            <span class="navbar-text mx-3">
                {{ user.first_name }} {{ user.last_name }}
            </span>
            <a class="btn btn-info mx-2" href="{% url 'users:profile' user.pk %}">Профиль</a>

            {% if user.is_superuser %}
            <a class="btn btn-success mx-2" href="/admin/">Админка</a>
            {% endif %}

            <form method="post" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
            {% else %}
            <a class="btn btn-success" href="{% url 'users:login' %}">Войти</a>
            {% endif %}
        </nav>
    </header>

    {% block content %}
    {% endblock %}
</div>

<!-- Скрипты -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'production_plan/js/scripts.js' %}"></script>
</body>
</html>
