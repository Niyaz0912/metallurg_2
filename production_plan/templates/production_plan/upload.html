{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4>{{ title }}</h4>
        </div>
        <div class="card-body">
            {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="alert alert-info">
                <h5>Требования к файлу:</h5>
                <ul>
                    {% for col in example_columns %}
                    <li>{{ col }}</li>
                    {% endfor %}
                </ul>
                <a href="{{ example_file_url }}" class="btn btn-sm btn-outline-primary">Скачать шаблон</a>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="file" class="form-label">Файл Excel</label>
                    <input type="file" class="form-control" id="file" name="file" accept=".xlsx, .xls" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'production_plan:list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Назад
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload"></i> Загрузить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
