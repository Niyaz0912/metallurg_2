{% extends 'base.html' %}

{% block content %}
<h1>Создать производственный план</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Создать</button>
    <a href="{% url 'production_plan:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
