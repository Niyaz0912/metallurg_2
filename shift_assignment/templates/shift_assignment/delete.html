{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4>Удаление задания</h4>
        </div>
        <div class="card-body">
            <p>Вы уверены, что хотите удалить это сменное задание?</p>
            <div class="alert alert-warning">
                <strong>Деталь:</strong> {{ object.part }}<br>
                <strong>Оператор:</strong> {{ object.operator.get_full_name }}<br>
                <strong>Дата:</strong> {{ object.date|date:"d.m.Y" }}
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'shift_assignment:detail' object.pk %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
