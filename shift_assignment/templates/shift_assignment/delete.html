{% extends "base.html" %}
{% block content %}
<h2>Удаление задания</h2>
<p>Вы действительно хотите удалить задание <strong>#{{ object.id }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'shift_assignment:detail' object.id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
