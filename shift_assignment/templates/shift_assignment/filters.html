<div class="mb-3">
    <form method="get" class="row g-3">
        <div class="col-md-3">
            <input type="text" name="operator" class="form-control" placeholder="Оператор" value="{{ request.GET.operator }}">
        </div>
        <div class="col-md-3">
            <input type="text" name="machine" class="form-control" placeholder="Станок" value="{{ request.GET.machine }}">
        </div>
        <div class="col-md-3">
            <input type="date" name="date_from" class="form-control" value="{{ request.GET.date_from }}">
        </div>
        <div class="col-md-3">
            <input type="date" name="date_to" class="form-control" value="{{ request.GET.date_to }}">
        </div>
        <div class="col-md-12">
            <button type="submit" class="btn btn-primary">Фильтровать</button>
            <a href="?" class="btn btn-outline-secondary">Сбросить</a>
        </div>
    </form>
</div>
