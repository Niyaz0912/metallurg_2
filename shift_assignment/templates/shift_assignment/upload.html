{% extends "base.html" %}
{% block content %}
<h2>Загрузка заданий из Excel</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Загрузить</button>
    <a href="{% url 'shift_assignment:active' %}" class="btn btn-secondary">Отмена</a>
    <a href="{% url 'shift_assignment:download_template' %}" class="btn btn-link">Скачать шаблон Excel</a>
</form>
{% endblock %}
