{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-primary">
        <div class="card-header bg-primary text-white">
            <h4><i class="bi bi-upload me-2"></i>{{ title }}</h4>
        </div>
        <div class="card-body">

            <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="excel_file" class="form-label">Выберите файл Excel:</label>
                    <input type="file" class="form-control" id="excel_file"
                           name="file" accept=".xlsx, .xls" required>
                    <div class="invalid-feedback">Пожалуйста, выберите файл для загрузки</div>
                    <div class="form-text">Поддерживаются файлы .xlsx и .xls</div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{% url 'shift_assignment:list' %}" class="btn btn-secondary me-md-2">
                        <i class="bi bi-arrow-left me-2"></i>Назад к списку
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload me-2"></i>Загрузить задания
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Валидация формы на клиенте
(function() {
    'use strict'

    // Показываем ошибки при отправке
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })

    // Показываем имя выбранного файла
    const fileInput = document.getElementById('excel_file')
    fileInput.addEventListener('change', function(e) {
        const fileName = e.target.files[0]?.name || 'Файл не выбран'
        document.querySelector('.form-text').textContent = `Выбран файл: ${fileName}`
    })
})()
</script>

<style>
.card {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
}
</style>
{% endblock %}
